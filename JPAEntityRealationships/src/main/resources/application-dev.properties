# =========================================================
# DEVELOPMENT PROFILE
# =========================================================

spring.application.name=JPAEntityRelationships

server.port=8080


# =========================================================
# POSTGRESQL DATABASE
# =========================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/mobilebackend

spring.datasource.username=${DB_USERNAME:postgres}

spring.datasource.password=${DB_PASSWORD:nag@123}

spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false


# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET:myDevelopmentSecretKeyForJwtAuthentication123456789}

jwt.access-expiration=${JWT_ACCESS_EXPIRATION:3600}

jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:86400}


# =========================================================
# LOGGING
# =========================================================

logging.level.root=INFO

logging.level.org.example.jpaentityrelationships=DEBUG

logging.level.org.springframework.security=INFO

logging.level.org.hibernate.SQL=DEBUG

logging.level.org.hibernate.orm.jdbc.bind=TRACE

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n


# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info,metrics,scheduledtasks

management.endpoint.health.show-details=always

management.info.env.enabled=true


# =========================================================
# ASYNC PROCESSING
# =========================================================

spring.task.execution.pool.core-size=5

spring.task.execution.pool.max-size=10

spring.task.execution.pool.queue-capacity=100

spring.task.execution.thread-name-prefix=async-


# =========================================================
# SCHEDULED TASKS
# =========================================================

spring.task.scheduling.pool.size=3

spring.task.scheduling.thread-name-prefix=scheduler-